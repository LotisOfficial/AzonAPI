# AZON API only. NOT YET BUILT OR TESTED - see docs/BUILD_LOG.md.
#
# Before `docker compose up -d --build`:
#   1. Copy .env.example to .env and set AZON_REPOSITORIES_DIR.
#   2. Create secrets/api_tokens.json (python tools/make_token.py <name> <role>).
#   3. Create secrets/viewer_targets.json and secrets/viewer_pwd.txt
#      (use {} in viewer_targets.json to disable publishing).

services:
  api:
    build: .
    container_name: azon-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5200:5200"          # loopback only; never 0.0.0.0
    environment:
      REPO_ROOT: /data/repositories
      PPRJ_FILE: /data/repositories/${AZON_DEFAULT_REPOSITORY:?set AZON_DEFAULT_REPOSITORY in .env}
      CONFIG_FILE: /data/config/active.json
      AZON_API_TOKENS_FILE: /run/secrets/api_tokens
      AZON_VIEWER_TARGETS_FILE: /run/secrets/viewer_targets
    volumes:
      - ${AZON_REPOSITORIES_DIR:?set AZON_REPOSITORIES_DIR in .env}:/data/repositories
      - api-config:/data/config
    secrets:
      - api_tokens
      - viewer_targets
      - viewer_pwd
    extra_hosts:
      - "host.docker.internal:host-gateway"   # to publish to a Viewer on the host
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  api_tokens:
    file: ./secrets/api_tokens.json
  viewer_targets:
    file: ./secrets/viewer_targets.json
  viewer_pwd:
    file: ./secrets/viewer_pwd.txt

volumes:
  api-config:
